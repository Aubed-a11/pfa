# =============================================
# Phase 2 - Configuration PostgreSQL
# =============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pfa_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================
# Phase 4 - Configuration JWT
# =============================================
app.jwt.secret=${APP_JWT_SECRET:pfa2026SuperSecretKeyForJwtTokenGeneration1234567890}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

# Serveur
server.port=8080
spring.application.name=pfa-backend
