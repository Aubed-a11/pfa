version: '3.8'

services:

  # =============================================
  # PostgreSQL - Base de données
  # =============================================
  postgres:
    image: postgres:16-alpine
    container_name: pfa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pfa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pfa_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pfa_network

  # =============================================
  # Spring Boot - Backend API
  # =============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pfa_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pfa_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_JWT_SECRET: pfa2026SuperSecretKeyForJwtTokenGeneration1234567890
      APP_JWT_EXPIRATION: 86400000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pfa_network

  # =============================================
  # pgAdmin - Interface admin PostgreSQL
  # =============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pfa_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pfa.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - pfa_network

volumes:
  postgres_data:

networks:
  pfa_network:
    driver: bridge
